<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <link rel="icon" type="image/png" href="resouces/youtube-icon.png">
        <title>(342) Youtube</title>
    
        <link rel="stylesheet" href="styles.css">
    </head>
    
    <body>
        <header>
            <div>
                <img id="menu-icon" src="resouces/menu-icon.svg" alt="menu"/>
                <img id="logo-icon" src="resouces/youtube-text-icon.svg" alt="logo"/>
                <sup>ZA</sup>
            </div>
            
            <div>
                <input id="search" type="search" placeholder="Search"/>
                <img id="search-icon" src="resouces/search-icon.svg" alt="search"/>

                <img id="microphone-icon" src="resouces/microphone-icon.svg" alt="microphone"/>
            </div>

            <div>
                <span class="button">
                    <img id="create-icon" src="resouces/create-icon.svg" alt="create"/>
                    Create
                </span>
                
                <img id="notifications" src="resouces/notifications-icon.svg" alt="notifications"/>
                <img id="avatar" src="resouces/avatar.png" alt="avatar"/>
            </div>
            
        </header>
